dogs:
  '1':
    name: Scout
    breed: croisé Shih Tzu
    h1: 'Coloriage croisé Shih Tzu : Scout'
    story: <strong>Scout</strong>, un petit croisé Shih Tzu tout doux, est prêt pour sa promenade ! Il a même un bonnet à <strong>pompon</strong> !
    fun_fact: Les Shih Tzus ont un long double pelage qui leur tient bien chaud.
    alt: 'Coloriage : Scout, en manteau tricoté à boutons et bonnet à pompon, attend près d''une porte en bois, prêt pour sa promenade (croisé Shih Tzu)'
    hook: Je pourrais faire ça toute la journée
    scene: Scout, un croisé Shih Tzu tout doux en pull et bonnet à pompon, prêt pour sa promenade.
    description: 'Coloriage croisé Shih Tzu : Scout, page 1 du livre PAWS. Scout, un croisé Shih Tzu tout doux en pull et bonnet à pompon, prêt pour sa promenade. Aperçu vidéo gratuit ; coloriage à imprimer avec sa vidéo QR à 1,99 $ US.'
  '2':
    name: Barnaby
    breed: croisé Corgi
    h1: 'Coloriage croisé Corgi : Barnaby'
    story: <strong>Barnaby</strong> a sorti une petite patte de sous la couverture blanche. Il était prêt pour le petit-déjeuner et pour un <strong>entraînement sérieux de rassemblement de jouets</strong> !
    fun_fact: null
    alt: 'Coloriage : Barnaby sort d''une douce couverture blanche, une patte tendue, prêt pour le petit-déjeuner et pour rassembler ses jouets (croisé Corgi)'
    hook: 'En pleine recharge : 100 % douceur'
    scene: Barnaby le Corgi sort une petite patte de sa douce couverture blanche.
    description: 'Coloriage croisé Corgi : Barnaby, page 2 du livre PAWS. Barnaby le Corgi sort une petite patte de sa douce couverture blanche. Aperçu vidéo gratuit ; coloriage à imprimer avec sa vidéo QR à 1,99 $ US.'
  '3':
    name: Maya
    breed: croisé Golden Retriever et épagneul
    h1: 'Coloriage croisé Golden Retriever et épagneul : Maya'
    story: 'J''ai entendu un emballage crépiter à trois pièces d''ici, alors bien sûr, je suis venu enquêter. Ne fais pas attention à moi : je suis pratiquement un agent secret, mais pour les friandises.'
    fun_fact: null
    alt: 'Coloriage : un chien tout doux jette un œil derrière une porte et enquête comme un espion sur le bruit d''un emballage de friandise (croisé Golden Retriever et épagneul)'
    hook: 100 % coton, 0 % discrétion
    scene: Un chien tout doux jette un œil derrière la porte, en mission secrète pour des friandises.
    description: 'Coloriage croisé Golden Retriever et épagneul : Maya, page 3 du livre PAWS. Un chien tout doux jette un œil derrière la porte, en mission secrète pour des friandises. Aperçu vidéo gratuit ; coloriage à imprimer avec sa vidéo QR à 1,99 $ US.'
  '4':
    name: Ponchik et Cherry
    breed: null
    h1: 'Coloriage chien : Ponchik et Cherry'
    story: Nous étions venus choisir un seul chiot, mais impossible de nous décider… alors maintenant, <strong>Ponchik</strong> et <strong>Cherry</strong> se blottissent ensemble sous une couverture, sur notre lit.
    fun_fact: null
    alt: 'Coloriage : deux chiots, Ponchik et Cherry, blottis l''un contre l''autre sous une couette sur le lit'
    hook: Surdose de mignon imminente
    scene: Deux chiots blottis l'un contre l'autre, parce que personne n'a pu en choisir un seul.
    description: 'Coloriage chien : Ponchik et Cherry, page 4 du livre PAWS. Deux chiots blottis l''un contre l''autre, parce que personne n''a pu en choisir un seul. Aperçu vidéo gratuit ; coloriage à imprimer avec sa vidéo QR à 1,99 $ US.'
  '5':
    name: Melody
    breed: null
    h1: 'Coloriage chien : Melody'
