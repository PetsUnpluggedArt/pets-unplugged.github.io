    scene: Un perro peludito se asoma por la puerta, en una misión secreta en busca de golosinas.
    description: 'Dibujo de mestizo de Golden Retriever y spaniel para colorear: Maya, página 3 del libro PAWS. Un perro peludito se asoma por la puerta, en una misión secreta en busca de golosinas. Vista previa del vídeo gratis; dibujo para imprimir con su vídeo QR por 1,99 US$.'
