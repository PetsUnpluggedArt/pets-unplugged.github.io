    breed: mestizo de Golden Retriever y spaniel
    h1: 'Dibujo de mestizo de Golden Retriever y spaniel para colorear: Maya'
    story: 'Oí crujir un envoltorio a tres habitaciones de distancia, así que, claro, vine a investigar. No me hagas caso: soy prácticamente un agente secreto, pero de golosinas.'
    fun_fact: null
    alt: 'Dibujo para colorear: un perro peludito se asoma por una puerta e investiga como un espía el crujido de un envoltorio de golosinas (mestizo de Golden Retriever y spaniel)'
