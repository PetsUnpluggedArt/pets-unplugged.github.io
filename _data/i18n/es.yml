  '1':
    name: Scout
    breed: mestizo de Shih Tzu
    h1: 'Dibujo de mestizo de Shih Tzu para colorear: Scout'
    story: ¡<strong>Scout</strong>, un mestizo de Shih Tzu muy peludito, está listo para el paseo! ¡Hasta tiene un gorro con <strong>pompón</strong>!
    fun_fact: Los Shih Tzu tienen un pelaje largo y doble que los mantiene calentitos.
    alt: 'Dibujo para colorear: Scout, con un abrigo de punto con botones y un gorro de pompón, espera junto a una puerta de madera, listo para su paseo (mestizo de Shih Tzu)'
    hook: Podría hacer esto todo el día
    scene: Scout, un mestizo de Shih Tzu muy peludito con jersey y gorro de pompón, listo para su paseo.
    description: 'Dibujo de mestizo de Shih Tzu para colorear: Scout, página 1 del libro PAWS. Scout, un mestizo de Shih Tzu muy peludito con jersey y gorro de pompón, listo para su paseo. Vista previa del vídeo gratis; dibujo para imprimir con su vídeo QR por 1,99 US$.'
