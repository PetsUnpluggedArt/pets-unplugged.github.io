    breed: mestizo de Corgi
    h1: 'Dibujo de mestizo de Corgi para colorear: Barnaby'
    story: <strong>Barnaby</strong> sacó una patita de debajo de la manta blanca. ¡Estaba listo para desayunar y para un <strong>entrenamiento muy serio de pastoreo de juguetes</strong>!
    fun_fact: null
    alt: 'Dibujo para colorear: Barnaby asoma de una manta blanca y suave con una patita estirada, listo para desayunar y pastorear sus juguetes (mestizo de Corgi)'
    hook: 'Recargando: 100 % pelusa'
    scene: Barnaby, el Corgi, saca una patita de su manta blanca y calentita.
    description: 'Dibujo de mestizo de Corgi para colorear: Barnaby, página 2 del libro PAWS. Barnaby, el Corgi, saca una patita de su manta blanca y calentita. Vista previa del vídeo gratis; dibujo para imprimir con su vídeo QR por 1,99 US$.'
