# Site settings for Pets Unplugged

title: Pets Unplugged
tagline: "Unplug. Color. Animate."
description: Coloring pages with a story. Color the page, scan its QR code, and watch the pet you just colored come to life. Dog and cat coloring pages, the PAWS book, free pages and merch.
email: hello@petsunplugged.com

url: "https://petsunplugged.com"
baseurl: ""

# Clean URLs for blog posts only — videos keep .html extension via defaults below
permalink: /blog/:slug/

twitter:
  username: PetsUnplugged
  card: summary_large_image

author:
  name: Pets Unplugged
  email: hello@petsunplugged.com

logo: /assets/img/logo.png
image: /assets/img/og/site.jpg

# ---------------------------------------------------------------------------
# Forms: newsletter, "Your pet" waitlist and the "Tell me" notes all post to this Brevo form,
# so every sign-up lands in the same Brevo list. The email field is named EMAIL, as Brevo needs.
# The address and the reCAPTCHA key are the ones from the Brevo form on the old home page.
# Empty form_endpoint = forms show a "coming soon" note and send nothing.
form_endpoint: "https://d594eb7c.sibforms.com/serve/MUIFANGdb0jKFrBXiNX2Hq2bKn4r-c14bcEGV-BiOMN221c5jrdcUYXPD0vEnTvxzE4V8O09i-6btQMjoiSofRFKpfyGHTx1E9xYtefgb9FKTCfxHZ88bhmN7A1bOOiU91kLmqhXMPYBlKMaAGuaIwKPFMyWlV7Gngzp8U3g6sCz4wz4oCSOCREFJY0xdvSA35yRDpnu_2nEFyF7wA=="
form_recaptcha_key: "6LcBYSssAAAAAHyybuB7qBL--CJ-z1vhyNU13cFl"

# Free gift: Pompom (PAWS page 1) with its animation, a free Payhip product that asks for an email.
free_gift_url: "https://payhip.com/b/WMkrK"
# ---------------------------------------------------------------------------

prices:
  pdf_book: "$6.99"
  single_page: "$1.99"
  bundle: "$3.99"

links:
  payhip_book: "https://payhip.com/b/zhxGf"
  amazon: "https://a.co/d/7uVHHhw"
  etsy: "https://www.etsy.com/shop/PetsUnpluggedStudio"

collections:
  collections:
    output: true
  videos:
    output: true
    sitemap: false
    permalink: /videos/:name.html
  merchandise:
    output: true
  dogs:
    output: true
    permalink: /coloring-pages/:name/
  products:
    output: true
    permalink: /merchandise/:name/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og/site.jpg
  - scope:
      path: ""
      type: "pages"
    values:
      sitemap: true
      permalink: /:path/:basename.html
  - scope:
      path: ""
      type: "posts"
    values:
      sitemap: true
      layout: post
  - scope:
      path: ""
      type: "dogs"
    values:
      layout: dog
  - scope:
      path: ""
      type: "products"
    values:
      layout: product
  - scope:
      path: "videos"
    values:
      permalink: /videos/:basename.html
      sitemap: false
  - scope:
      path: "videos/etsy-videos"
    values:
      permalink: /videos/etsy-videos/:basename.html
      sitemap: false
  - scope:
      path: "whiskers-videos"
    values:
      sitemap: false

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - gemfile
  - gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - optimize_images.py.py
  - README.md

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
